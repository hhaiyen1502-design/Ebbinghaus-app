<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn Thi Toàn Diện Lớp 9 - Ebbinghaus & AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-p-4">
    <div class="max-w-xl mx-auto p-4">
        <!-- Tiêu đề -->
        <header class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-600">🎯 Trạm Ôn Thi Vào 10 - Lớp 9</h1>
            <p class="text-sm text-slate-500">Chinh phục toàn diện kiến thức Toán - Văn - Anh</p>
        </header>

        <!-- Khung cài đặt API Key -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-slate-100">
            <label class="block text-xs font-semibold text-slate-600 mb-1">🔑 Nhập Google Gemini API Key của bé:</label>
            <input type="password" id="apiKey" placeholder="Dán API Key vào đây..." class="w-full p-2 text-sm border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        </div>

        <!-- Chọn môn học -->
        <div class="grid grid-cols-3 gap-2 mb-4">
            <button onclick="selectSubject('Toán 9')" class="sub-btn p-3 bg-white border border-indigo-200 rounded-xl text-sm font-medium hover:bg-indigo-50 transition">📐 Toán 9</button>
            <button onclick="selectSubject('Ngữ Văn 9')" class="sub-btn p-3 bg-white border border-indigo-200 rounded-xl text-sm font-medium hover:bg-indigo-50 transition">📖 Ngữ Văn 9</button>
            <button onclick="selectSubject('Tiếng Anh 9')" class="sub-btn p-3 bg-white border border-indigo-200 rounded-xl text-sm font-medium hover:bg-indigo-50 transition">🇬🇧 Tiếng Anh 9</button>
        </div>

        <!-- Khung yêu cầu AI sinh câu hỏi / tóm tắt kiến thức -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-4 border border-slate-100">
            <h2 id="currentSubject" class="font-semibold text-indigo-600 mb-2">💡 Hãy chọn môn học ở trên</h2>
            <textarea id="promptInput" rows="3" placeholder="Nhập yêu cầu ôn tập (Ví dụ: Cho anh 5 câu bài tập hệ phương trình hoặc tổng hợp kiến thức thơ tình Việt Nam...)" class="w-full p-3 text-sm border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none resize-none"></textarea>
            <button onclick="askAI()" class="w-full mt-3 bg-indigo-600 text-white py-2.5 rounded-xl font-medium hover:bg-indigo-700 transition shadow-md">✨ Tạo nội dung ôn tập cùng AI</button>
        </div>

        <!-- Kết quả hiển thị -->
        <div id="resultBox" class="bg-white p-4 rounded-xl shadow-sm border border-slate-100 hidden">
            <h3 class="font-semibold text-slate-700 mb-2">📜 Nội dung ôn tập:</h3>
            <div id="outputContent" class="text-sm text-slate-600 space-y-2 whitespace-pre-line leading-relaxed"></div>
        </div>
    </div>

    <script>
        let selectedSub = "";
        function selectSubject(subject) {
            selectedSub = subject;
            document.getElementById('currentSubject').innerText = "📚 Môn đang chọn: " + subject;
            document.getElementById('promptInput').placeholder = "Nhập nội dung cần ôn tập phần " + subject + " (VD: Ôn tập chuyên đề, làm bài tập biến đổi, câu điều kiện...)";
        }

        async function askAI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('promptInput').value.trim();
            const resultBox = document.getElementById('resultBox');
            const outputContent = document.getElementById('outputContent');

            if (!apiKey) {
                alert("Bé nhớ nhập API Key ở ô trên trước nhé!");
                return;
            }
            if (!selectedSub) {
                alert("Bé hãy bấm chọn môn học trước nha!");
                return;
            }
            if (!prompt) {
                alert("Bé hãy nhập yêu cầu cần ôn tập vào khung nhé!");
                return;
            }

            outputContent.innerHTML = "⏳ Đang tổng hợp kiến thức lớp 9 cho bé, đợi xíu nha...";
            resultBox.classList.remove('hidden');

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Bạn là trợ lý học tập lớp 9 giỏi. Hãy giúp học sinh ôn tập môn ${selectedSub} theo yêu cầu sau: ${prompt}. Trình bày ngắn gọn, dễ hiểu, chuẩn kiến thức Kết nối tri thức và cấu trúc thi vào lớp 10.` }]
                        }]
                    })
                });

                const data = await response.json();
                const text = data.candidates[0].content.parts[0].text;
                outputContent.innerHTML = text;
            } catch (error) {
                outputContent.innerHTML = "❌ Có lỗi kết nối hoặc API Key chưa đúng, bé kiểm tra lại giúp anh nhé!";
            }
        }
    </script>
</body>
</html>
